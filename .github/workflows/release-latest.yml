name: Build and Release to Latest

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'

  workflow_dispatch:
    inputs:
      release_message:
        description: 'Release message (optional)'
        required: false
        default: ''

env:
  JAVA_VERSION: '17'
  RELEASE_REPO: aleksandrsvoboda/nurgling-release
  RELEASE_BRANCH: latest

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout nurgling2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache external libraries
        uses: actions/cache@v4
        with:
          path: lib/ext
          key: extlibs-${{ runner.os }}-${{ hashFiles('build.xml') }}
          restore-keys: |
            extlibs-${{ runner.os }}-

      - name: Fetch and increment version
        shell: pwsh
        run: |
          # Get version.num from build.xml
          $buildXml = Get-Content "build.xml" -Raw
          if ($buildXml -match 'version\.num"\s+value="([^"]+)"') {
            $versionNum = $matches[1]
          } else {
            $versionNum = "2.103"
          }
          Write-Host "version.num from build.xml: $versionNum"

          $verUrl = "https://raw.githubusercontent.com/${{ env.RELEASE_REPO }}/${{ env.RELEASE_BRANCH }}/ver"
          try {
            $currentVer = (Invoke-WebRequest -Uri $verUrl -UseBasicParsing).Content.Split("`n")[0].Trim()
            Write-Host "Current version in release repo: $currentVer"
            $parts = $currentVer.Split(".")
            $currentMajorMinor = "$($parts[0]).$($parts[1])"

            if ($currentMajorMinor -eq $versionNum) {
              $buildNum = [int]$parts[-1] + 1
              Write-Host "Same major.minor version, incrementing build number to: $buildNum"
            } else {
              $buildNum = 0
              Write-Host "Major.minor version changed ($currentMajorMinor -> $versionNum), starting at build number: $buildNum"
            }
          } catch {
            Write-Host "Could not fetch version from release repo, starting at build 0"
            $buildNum = 0
          }
          $releaseVersion = "$versionNum.$buildNum"
          echo "VERSION=$releaseVersion" >> $env:GITHUB_ENV
          Write-Host "Release version: $releaseVersion"

      - name: Build with Ant
        run: ant release

      # The updater (private nurgling-updater repo) publishes its builds as releases of the
      # release repo; every client release ships the newest one.
      - name: Add the latest updater
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo ${{ env.RELEASE_REPO }} --dir updater-assets `
            --pattern "nurgling-updater.jar" --pattern "core.jar" --pattern "*.bat" --pattern "*.sh" `
            --pattern "*.command" --pattern "nurgling_launcher.jar" --pattern "runtime.json" --pattern "SHA256SUMS"
          if ($LASTEXITCODE -ne 0) { throw "could not download the updater release" }
          foreach ($line in Get-Content "updater-assets\SHA256SUMS") {
            $sum, $name = $line -split '\s+\*?', 2
            $path = "updater-assets\$name"
            if (!(Test-Path $path)) { continue }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $sum) { throw "checksum mismatch for $name" }
          }
          New-Item -ItemType Directory -Force release\updater | Out-Null
          Copy-Item updater-assets\core.jar release\updater\core.jar
          # Nurgling.bat/.sh/.command, plus the old launcher and run_updater*.bat kept as a fallback
          Copy-Item updater-assets\nurgling-updater.jar, updater-assets\nurgling_launcher.jar, updater-assets\*.bat, updater-assets\*.sh, updater-assets\*.command release\

      - name: Write manifest and ver
        shell: pwsh
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Companion apps (HnH Scheduler): newest release, pinned by GitHub's sha256 digests.
          # Never fails the release; publish keeps the previous release's apps if this can't resolve.
          java -jar release/updater/core.jar resolve-apps etc/release.json apps.json
          try {
            Invoke-WebRequest -UseBasicParsing -OutFile previous-manifest.json `
              -Uri "https://raw.githubusercontent.com/${{ env.RELEASE_REPO }}/${{ env.RELEASE_BRANCH }}/manifest.json"
          } catch {
            Write-Host "No previous manifest (first release with the new updater)"
          }
          $note = "${{ github.event.inputs.release_message }}"
          if ($note -eq "") { $note = git log -1 --pretty=%s }
          $prev = @()
          if (Test-Path previous-manifest.json) { $prev = @("--previous", "previous-manifest.json") }
          java -jar release/updater/core.jar publish release --version $env:VERSION --git-rev $env:GITHUB_SHA `
            --note "$note" --config etc/release.json --runtime updater-assets/runtime.json --apps apps.json `
            --sign-with-env MANIFEST_SIGNING_KEY @prev
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }

      - name: Verify build artifacts
        shell: pwsh
        run: |
          $requiredFiles = @("hafen.jar", "ver", "nurgling-res.jar", "manifest.json", "manifest.json.sig", "nurgling-updater.jar", "updater\core.jar")
          foreach ($file in $requiredFiles) {
            if (!(Test-Path "release\$file")) {
              Write-Error "Missing required file: release\$file"
              exit 1
            }
          }

          $version = (Get-Content "release\ver" -First 1).Trim()
          Write-Host "Build successful - Version: $version"
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nurgling-release-${{ env.VERSION }}
          path: release/
          retention-days: 30

      - name: Push to release repository
        shell: pwsh
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Files ship byte-for-byte: manifest hashes and the .bat shims' offsets depend on it.
          git config --global core.autocrlf false
          git clone "https://x-access-token:$env:RELEASE_TOKEN@github.com/${{ env.RELEASE_REPO }}.git" release-repo
          cd release-repo

          git checkout ${{ env.RELEASE_BRANCH }}
          if ($LASTEXITCODE -ne 0) {
            git checkout -b ${{ env.RELEASE_BRANCH }}
          }

          Get-ChildItem -Exclude ".git" | Remove-Item -Recurse -Force

          Copy-Item "..\release\*" . -Recurse

          git add -A
          git update-index --chmod=+x nurgling.sh Nurgling.command

          $message = "Release ${{ env.VERSION }}"
          if ("${{ github.event.inputs.release_message }}" -ne "") {
            $message = "$message - ${{ github.event.inputs.release_message }}"
          } else {
            $triggerMsg = "${{ github.event.head_commit.message }}" -replace "`n.*", ""
            if ($triggerMsg.Length -gt 50) {
              $triggerMsg = $triggerMsg.Substring(0, 50) + "..."
            }
            $message = "$message - $triggerMsg"
          }

          git commit -m $message
          git push origin ${{ env.RELEASE_BRANCH }}

          Write-Host "Successfully pushed to ${{ env.RELEASE_REPO }}@${{ env.RELEASE_BRANCH }}"
